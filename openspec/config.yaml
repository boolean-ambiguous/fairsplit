schema: spec-driven

context: |
  FairSplit — a small expense-splitting web app (groups, shared expenses,
  balances, settlement suggestions).

  Tech stack: Python 3.11, FastAPI, SQLModel (SQLite), Jinja2 templates,
  HTMX for interactivity (vendored, no JS build step). Tests with pytest
  and FastAPI's TestClient.

  Conventions:
  - Money is stored as integer cents; never floats.
  - Domain logic lives in app/services/, thin route handlers in app/routes/.
  - Every capability change ships with tests in tests/.
  - Conventional commits: spec:/feat:/fix:/chore: prefixes.

rules:
  proposal:
    - Keep proposals under 400 words
    - Always include a "Non-goals" section
  tasks:
    - Group tasks by layer (models, services, routes, templates, tests)
