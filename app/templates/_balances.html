<div class="card" id="balances" {% if oob %}hx-swap-oob="true"{% endif %}>
  <ul class="plain">
    {% for member in members %}
    {% set bal = balances.get(member.id, 0) %}
    <li>
      {{ member.name }}:
      {% if bal > 0 %}
      <span class="amount positive">is owed {{ bal | money }}</span>
      {% elif bal < 0 %}
      <span class="amount negative">owes {{ (-bal) | money }}</span>
      {% else %}
      <span class="amount muted">settled up</span>
      {% endif %}
    </li>
    {% else %}
    <li class="muted">No members yet.</li>
    {% endfor %}
  </ul>
</div>
