<div class="card">
  <form class="inline" hx-post="/groups/{{ group.id }}/members" hx-target="#members" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
    <label>Add member
      <input type="text" name="name" placeholder="Name" required>
    </label>
    <button type="submit">Add</button>
  </form>
  {% if member_error %}<p class="negative">{{ member_error }}</p>{% endif %}
  <ul class="plain">
    {% for member in members %}
    <li>{{ member.name }}</li>
    {% else %}
    <li class="muted">No members yet.</li>
    {% endfor %}
  </ul>
</div>
