{% extends "base.html" %}
{% block title %}Groups — FairSplit{% endblock %}
{% block content %}
<h1>Groups</h1>

<div class="card">
  <form class="inline" hx-post="/groups" hx-target="#group-list" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
    <label>New group
      <input type="text" name="name" placeholder="e.g. Ski trip" required>
    </label>
    <button type="submit" class="btn">Create</button>
  </form>
</div>

<ul class="plain" id="group-list">
  {% include "_group_list_items.html" %}
</ul>
{% endblock %}
